<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Күзгі жапырақтарды жинайық</title>
<style>
:root{--ink:#4a2a12;--f:"Trebuchet MS","Segoe UI","Arial Rounded MT Bold",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--f);color:var(--ink);background:#f6a84a}
img{-webkit-user-drag:none;pointer-events:none}
#bg{position:fixed;inset:0;background-size:cover;background-position:center}
#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,244,214,.3),rgba(255,190,110,.4))}
#leaves{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.fl{position:absolute;top:-9vh;animation:fall linear infinite;opacity:.85}
@keyframes fall{to{transform:translate(9vw,114vh) rotate(540deg)}}
.screen{position:fixed;inset:0;z-index:2;display:none;flex-direction:column;align-items:center;justify-content:center;padding:2vh 3vw;gap:2vh;text-align:center;overflow:auto}
.screen.on{display:flex}
.plank{background:linear-gradient(#cf9150,#a2602a 55%,#8a4a1e);border:.7vmin solid #6b3814;border-radius:24px;box-shadow:0 1vmin 0 #54290d,0 2vmin 3vmin rgba(0,0,0,.3),inset 0 .5vmin 0 rgba(255,255,255,.35);color:#fff8e6;text-shadow:0 .4vmin 0 #5a2d0e;font-weight:900}
.card{background:linear-gradient(#fffaea,#ffefc4);border:.8vmin solid #9a5b27;border-radius:26px;box-shadow:0 1vmin 0 #6b3814,0 2vmin 3vmin rgba(0,0,0,.25),inset 0 0 0 .5vmin #f3d79a}
.btn{font:inherit;font-weight:900;font-size:clamp(22px,4.2vmin,46px);color:#fff;text-shadow:0 .4vmin 0 #2f7a14;padding:1.6vmin 4.5vmin;border:.7vmin solid #3c8f1c;border-radius:999px;background:linear-gradient(#9cec6a,#4aa82a);box-shadow:0 1vmin 0 #2d6e13,0 2vmin 2.5vmin rgba(0,0,0,.3),inset 0 .6vmin 0 rgba(255,255,255,.55);cursor:pointer;transition:transform .12s}
.btn:hover{transform:translateY(-.5vmin) scale(1.04)}.btn:active{transform:translateY(.8vmin) scale(.97);box-shadow:0 .2vmin 0 #2d6e13}
.pulse{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.06)}}
#snd{position:fixed;top:1.5vmin;right:1.5vmin;z-index:50;width:clamp(48px,8vmin,72px);height:clamp(48px,8vmin,72px);border-radius:50%;font-size:clamp(22px,4vmin,36px);padding:0;border:.5vmin solid #6b3814;background:linear-gradient(#ffe7a8,#f0b45a);box-shadow:0 .7vmin 0 #6b3814;cursor:pointer}
/* start */
#start h1{margin:0;font-size:clamp(28px,6.4vmin,80px);line-height:1.15;padding:2.2vmin 5vmin;max-width:92vw;animation:bob 3s ease-in-out infinite}
#start .sub{font-size:clamp(20px,3.6vmin,40px);font-weight:800;padding:1.2vmin 3.5vmin}
@keyframes bob{50%{transform:translateY(-1.2vmin)}}
.pick{display:flex;gap:3vmin}
.pk{background:rgba(255,244,214,.85);border:.7vmin solid transparent;border-radius:24px;padding:1vmin 2.5vmin;cursor:pointer;font:inherit;font-weight:900;font-size:clamp(16px,2.6vmin,28px);color:var(--ink);transition:transform .15s}
.pk img{height:clamp(80px,19vh,190px);display:block;margin:0 auto}
.pk.sel{border-color:#58b934;background:#e9ffd6;transform:scale(1.08)}
.hi{font-size:clamp(18px,3vmin,32px);font-weight:900;padding:.8vmin 3vmin;border-radius:999px;background:rgba(255,250,234,.92);border:.5vmin solid #9a5b27}
.deco{position:absolute;pointer-events:none}
.d1{left:2vw;bottom:2vh;height:clamp(110px,26vh,260px)}.d2{left:12vw;bottom:1vh;height:clamp(60px,14vh,150px)}
.d3{right:3vw;bottom:2vh;height:clamp(80px,22vh,220px)}.d4{right:15vw;bottom:2vh;height:clamp(60px,15vh,150px)}
.d5{left:5vw;top:3vh;height:clamp(40px,10vh,100px);animation:fly 4s ease-in-out infinite}
@keyframes fly{50%{transform:translate(2vw,2vh) rotate(6deg)}}
/* game */
#game{justify-content:flex-start;gap:1.3vh;padding:1.2vh 2vw 0}
#hud{display:flex;gap:1.2vmin;width:100%;padding-right:clamp(56px,9vmin,84px);justify-content:center;flex-wrap:wrap}
.hc{background-size:100% 100%;background-repeat:no-repeat;padding:1.4vmin 2.6vmin;font-weight:900;font-size:clamp(14px,2.5vmin,28px);display:flex;align-items:center;gap:.8vmin;white-space:nowrap;min-height:clamp(40px,7.4vh,72px)}
.hc.y{background-image:var(--ny)}.hc.g{background-image:var(--ng)}.hc.p{background-image:var(--np)}.hc.b{background-image:var(--nb)}
.hc b{font-size:1.25em;min-width:1.3em;display:inline-block}.hc img{height:1.7em}
.hc.hit{animation:shake .45s}
#head{display:flex;align-items:center;gap:2vmin}
#head img{height:clamp(42px,8.5vh,86px)}
#lvl{font-weight:900;font-size:clamp(16px,2.8vmin,30px);padding:.8vmin 2.4vmin;border-radius:999px}
#qbox{width:min(1100px,94vw);padding:2vmin 3vmin;display:flex;flex-direction:column;align-items:center;gap:1.2vmin}
#qHint{font-weight:800;font-size:clamp(15px,2.6vmin,28px);opacity:.8}
#qText{font-weight:900;font-size:clamp(30px,7vmin,76px);line-height:1.15}
#qVis{display:flex;align-items:center;justify-content:center;gap:2vmin;flex-wrap:wrap;font-size:clamp(28px,6.6vmin,64px);min-height:1px}
#qVis .grp{display:flex;flex-wrap:wrap;justify-content:center;max-width:42vw}
#qVis .t{font-size:.9em;font-weight:900}#qVis .b{height:1.6em;margin-left:1vmin}
.lf{display:inline-block;animation:bounce 1.8s ease-in-out infinite}.lf:nth-child(2n){animation-delay:.3s}.lf:nth-child(3n){animation-delay:.6s}
@keyframes bounce{50%{transform:translateY(-.7vmin)}}
.slots{display:flex;gap:1.5vmin}.slot{width:1.5em;height:1.5em;border:.5vmin dashed #c7893f;border-radius:16px;font-weight:900;color:#c7893f;display:flex;align-items:center;justify-content:center;background:#fff}
.slot.f{border:.5vmin solid #58b934;color:#2f7a14;background:#e9ffd6;animation:pop .35s}
.circ{display:inline-block;width:1.15em;height:1.15em;border:.4vmin dashed #c7893f;border-radius:50%;vertical-align:middle;background:#fff}
#ans{display:grid;grid-template-columns:repeat(4,1fr);gap:2.4vmin;width:min(1100px,94vw)}
#ans.two{grid-template-columns:repeat(2,1fr)}#ans.five{grid-template-columns:repeat(5,1fr)}
.opt{font:inherit;font-weight:900;font-size:clamp(30px,7vmin,72px);color:#fff8e6;text-shadow:0 .5vmin 0 #5a2d0e;min-height:clamp(64px,13vh,120px);border:.7vmin solid #6b3814;border-radius:999px;background:radial-gradient(circle at 50% 22%,#e9ab63,#b36a2f 60%,#98531f);box-shadow:0 1vmin 0 #54290d,0 1.8vmin 2.4vmin rgba(0,0,0,.28),inset 0 .6vmin 0 rgba(255,255,255,.4);cursor:pointer;transition:transform .12s;position:relative}
.opt:hover{transform:translateY(-.6vmin) scale(1.04)}.opt:active{transform:translateY(.8vmin) scale(.96);box-shadow:0 .2vmin 0 #54290d}
.opt.ok{background:radial-gradient(circle at 50% 22%,#a6f27a,#4aa82a 70%);border-color:#2d6e13;animation:pop .4s}
.opt.ok::after{content:"✓";position:absolute;right:.3em;top:-.35em;font-size:.7em;color:#fff;background:#2f9d1d;border-radius:50%;width:1.1em;height:1.1em;line-height:1.1em;text-shadow:none}
.opt.bad{background:radial-gradient(circle at 50% 22%,#ff8f80,#d93c2d 70%);border-color:#8f1d12;animation:shake .45s}
.opt.bad::after{content:"✕";position:absolute;right:.3em;top:-.35em;font-size:.7em;color:#fff;background:#c0281b;border-radius:50%;width:1.1em;height:1.1em;line-height:1.1em;text-shadow:none}
.opt.used{opacity:.35;transform:scale(.9);pointer-events:none}.opt:disabled{cursor:default;transform:none}
@keyframes shake{20%{transform:translateX(-1.4vmin)}40%{transform:translateX(1.4vmin)}60%{transform:translateX(-1vmin)}80%{transform:translateX(1vmin)}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
#road{position:absolute;left:0;right:0;bottom:0;height:clamp(84px,17vh,170px);pointer-events:none;background-size:100% 62%;background-repeat:no-repeat;background-position:bottom}
#walker{position:absolute;bottom:14%;transition:left 1.1s ease-in-out;height:100%}
#walker img{height:100%;animation:walk .55s ease-in-out infinite}
@keyframes walk{50%{transform:translateY(-1.4vh) rotate(2deg)}}
#basketBox{position:absolute;right:2vw;bottom:6%;height:100%;display:flex;align-items:flex-end}
#basket{height:92%}#bCnt{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);font-weight:900;font-size:clamp(16px,3vmin,32px);color:#fff;text-shadow:0 .3vmin 2px #5a2d0e,0 0 6px #5a2d0e}
#fb{position:fixed;left:50%;top:24%;z-index:40;transform:translate(-50%,-50%) scale(0);pointer-events:none;text-align:center;opacity:0}
#fb.show{animation:fbs 1.5s forwards}
@keyframes fbs{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
#fb img{height:clamp(70px,16vh,150px);display:block;margin:0 auto}
#fb .fbt{font-weight:900;font-size:clamp(20px,4vmin,40px);color:#fff;background:#d93c2d;border-radius:999px;padding:.6vmin 3vmin;border:.5vmin solid #8f1d12;margin-top:.5vmin}
.fly{position:fixed;z-index:30;font-size:clamp(34px,6vmin,56px);transition:transform .85s cubic-bezier(.45,-.25,.7,1);pointer-events:none;margin:-.5em 0 0 -.5em}
.plus{position:fixed;z-index:31;font-weight:900;font-size:clamp(26px,5vmin,52px);color:#fff;text-shadow:0 .4vmin 0 #b5470d,0 0 8px #b5470d;pointer-events:none;animation:rise 1.1s forwards;transform:translateX(-50%)}
@keyframes rise{to{transform:translate(-50%,-9vh);opacity:0}}
.cf{position:fixed;z-index:35;pointer-events:none;animation:cf 1.3s ease-out forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
/* panel */
#pTitle{margin:0;font-size:clamp(28px,6.6vmin,76px);padding:1.8vmin 5vmin;max-width:94vw}
#pBody{font-weight:900;font-size:clamp(20px,4.2vmin,46px);line-height:1.5;padding:2vmin 5vmin;max-width:94vw}
#pImgs{display:flex;align-items:flex-end;justify-content:center;gap:2vmin;height:clamp(90px,24vh,240px)}#pImgs img{height:100%;animation:bob 2.6s ease-in-out infinite}
#pImgs img.s{height:40%;animation:pop .6s backwards}
@media (max-aspect-ratio:1/1){#ans{grid-template-columns:repeat(2,1fr)}#ans.five{grid-template-columns:repeat(3,1fr)}#qVis .grp{max-width:80vw}}
@media (max-width:700px){.d2,.d4,.d5{display:none}.d1,.d3{height:14vh}#hud{padding-right:0;padding-top:clamp(50px,8vmin,60px)}}
@media (prefers-reduced-motion:reduce){.fl,.pulse,#start h1,.lf,#walker img{animation:none}}
</style></head>
<body>
<div id="bg"></div><div id="leaves"></div>
<button id="snd" aria-label="Дыбыс">🔊</button>

<section id="start" class="screen on">
  <img class="deco d5" data-s="bird" alt=""><img class="deco d1" data-s="sign" alt=""><img class="deco d2" data-s="hedgehog" alt="">
  <img class="deco d3" data-s="squirrel" alt=""><img class="deco d4" data-s="mush" alt="">
  <h1 class="plank">🍂 КҮЗГІ ЖАПЫРАҚТАРДЫ ЖИНАЙЫҚ 🍂</h1>
  <div class="sub card">10 көлеміндегі сандарды қосу және азайту</div>
  <div class="pick">
    <button class="pk sel" id="pBoy"><img data-s="boy" alt="">Бала</button>
    <button class="pk" id="pGirl"><img data-s="girl" alt="">Қыз</button>
  </div>
  <button class="btn pulse" id="startBtn">▶ ОЙЫНДЫ БАСТАУ</button>
  <div class="hi">⭐ Ең жоғары ұпай: <span id="hiS">0</span></div>
</section>

<section id="game" class="screen">
  <div id="hud">
    <div class="hc y">🍂 Жиналған жапырақ: <b id="hLeaf">0</b></div>
    <div class="hc g" id="hcS">⭐ Ұпай: <b id="hScore">0</b></div>
    <div class="hc p" id="hcH">❤️ Өмір: <span id="hHearts"></span></div>
    <div class="hc b">📍 <b id="hQ" style="min-width:0">1/10</b>&nbsp;тапсырма</div>
  </div>
  <div id="head"><img data-s="board2" alt="Жапырақтарды жина!"><div id="lvl" class="plank"></div></div>
  <div id="qbox" class="card"><div id="qHint"></div><div id="qText"></div><div id="qVis"></div></div>
  <div id="ans"></div>
  <div id="road"><div id="walker"><img id="hero" alt=""></div>
    <div id="basketBox"><img id="basket" alt=""><span id="bCnt">0</span></div></div>
</section>

<section id="panel" class="screen">
  <h2 id="pTitle" class="plank"></h2><div id="pImgs"></div><div id="pBody" class="card"></div>
  <button class="btn pulse" id="pBtn"></button>
</section>
<div id="fb"></div>

/* ===== Дыбыс (Web Audio, бірінші басудан кейін) ===== */
let ac=null,muted=false;
function unlock(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function tone(f,t,d,type='sine',v=.16){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+t;o.type=type;o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d+.05)}
function playSound(n){if(muted||!ac)return;
  if(n==='ok')[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.25,'triangle'));
  else if(n==='bad'){tone(260,0,.18,'sine',.14);tone(200,.15,.28,'sine',.14)}
  else if(n==='pop'){tone(640,0,.09,'sine',.18);tone(900,.05,.09,'sine',.12)}
  else if(n==='win')[523,659,784,659,784,1047,1319].forEach((f,i)=>tone(f,i*.13,.35,'triangle'));}
addEventListener('pointerdown',unlock);
$('#snd').onclick=()=>{unlock();muted=!muted;$('#snd').textContent=muted?'🔇':'🔊'};

function later(fn,ms){const g=state.gen;setTimeout(()=>{if(g===state.gen)fn()},ms)}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
function tween(el,from,to){const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/450);el.textContent=Math.round(from+(to-from)*k);if(k<1)requestAnimationFrame(f)})(t0)}
function confetti(n=40){const c=['#f08a24','#e5483b','#ffd23f','#58b934','#4cb3ff'],em=['🍁','🍂','⭐'];
  for(let i=0;i<n;i++){const e=document.createElement('div');e.className='cf';
    if(i%3===0){e.textContent=em[rnd(0,2)];e.style.fontSize=rnd(20,34)+'px'}else{e.style.width=e.style.height=rnd(8,14)+'px';e.style.background=c[rnd(0,4)];e.style.borderRadius=i%2?'50%':'2px'}
    e.style.left='50%';e.style.top='35%';e.style.setProperty('--dx',rnd(-48,48)+'vw');e.style.setProperty('--dy',rnd(-10,60)+'vh');e.style.setProperty('--r',rnd(-720,720)+'deg');
    document.body.appendChild(e);setTimeout(()=>e.remove(),1400)}}
function feedback(ok){const f=$('#fb');f.innerHTML=ok?`<img src="${IMG.board4}">`:`<img src="${IMG.bad}"><div class="fbt">Қайта байқап көр!</div>`;f.classList.remove('show');void f.offsetWidth;f.classList.add('show')}

function numOpts(c){const near=[...Array(11).keys()].filter(x=>x!==c).sort((a,b)=>Math.abs(a-c)-Math.abs(b-c)||a-b).slice(0,3);
  return [c,...near].sort((a,b)=>a-b).map(v=>({l:String(v),ok:v===c}))}
const leaves=(n,e)=>`<div class="grp">${Array.from({length:n},()=>`<span class="lf">${e}</span>`).join('')}</div>`;
function generateQuestion(p){
  const {t,a,b}=p,q={t,kind:'choice',hint:'Дұрыс жауапты таңда!',vis:''};
  if(t==='add'){q.text=`🍁 ${a} + ${b} = ?`;q.opts=numOpts(a+b)}
  else if(t==='sub'){q.text=`🍂 ${a} − ${b} = ?`;q.opts=numOpts(a-b)}
  else if(t==='count'){q.hint='Жапырақтарды санап көр!';q.text='Барлығы неше жапырақ?';
    q.vis=`${leaves(a,'🍁')}<span class="t">+</span>${leaves(b,'🍂')}`;q.opts=numOpts(a+b)}
  else if(t==='vsub'){q.hint=`${a} жапырақтың ${b}-еуі себетке түсті`;q.text='Неше жапырақ қалды?';
    q.vis=`<div class="grp" id="vsG">${Array.from({length:a},(_,i)=>`<span class="lf${i>=a-b?' out':''}">🍁</span>`).join('')}</div><img class="b" id="vsB" src="${IMG.bEmpty}">`;
    q.opts=numOpts(a-b);q.after=()=>{const bk=$('#vsB');if(!bk)return;const r=bk.getBoundingClientRect();document.querySelectorAll('#qVis .out').forEach((e,i)=>{const er=e.getBoundingClientRect();
      e.style.animation='none';e.style.transition=`transform .8s ${i*.18}s,opacity .4s ${.8+i*.18}s`;e.style.transform=`translate(${r.left+r.width/2-er.left-er.width/2}px,${r.top+r.height/3-er.top}px) scale(.5)`;e.style.opacity=0})}}
  return q}

/* ===== Көрсету ===== */
function updateHUD(){tween($('#hScore'),state.shown,state.score);state.shown=state.score;
  $('#hLeaf').textContent=state.leaves;$('#hQ').textContent=`${Math.min(state.qi+1,10)}/10`;
  $('#hHearts').innerHTML=[0,1,2].map(i=>`<img src="${i<state.lives?IMG.heart:IMG.heartG}" alt="">`).join('');
  const L=state.leaves%10;$('#basket').src=IMG[L>=8||(state.leaves>=10)?'bFull':L>=4?'bHalf':'bEmpty'];$('#bCnt').textContent=state.leaves;
  $('#walker').style.left=(2+state.qi*8.6)+'%';
  const lv=LV[PLAN[Math.min(state.qi,9)].lv];$('#lvl').textContent=`${lv.i} ${PLAN[Math.min(state.qi,9)].lv+1}-деңгей: ${lv.n}`}
function showQuestion(q){state.cur=q;state.locked=false;state.oi=0;
  $('#qHint').textContent=q.hint;$('#qText').innerHTML=q.text;$('#qVis').innerHTML=q.vis;
  const a=$('#ans');a.innerHTML='';a.className=q.kind==='order'?'five':q.wide?'two':'';
  if(q.kind==='order'){const slots=[...document.querySelectorAll('.slot')];
    q.nums.forEach(v=>{const b=document.createElement('button');b.className='opt';b.textContent=v;
      b.onclick=()=>{if(state.locked||b.classList.contains('used'))return;
        if(v===q.sorted[state.oi]){b.classList.add('used');slots[state.oi].textContent=v;slots[state.oi].classList.add('f');state.oi++;playSound('pop');if(state.oi===5)checkAnswer(b,true)}
        else checkAnswer(b,false)};a.appendChild(b)})}
  else q.opts.forEach(o=>{const b=document.createElement('button');b.className='opt';b.innerHTML=o.l;b.onclick=()=>checkAnswer(b,o.ok);a.appendChild(b)});
  updateHUD();if(q.after)later(q.after,600)}
function loadQuestion(){show('game');showQuestion(generateQuestion(PLAN[state.qi]))}

/* ===== Жауап тексеру ===== */
function checkAnswer(btn,ok){if(state.locked)return;ok?handleCorrectAnswer(btn):handleWrongAnswer(btn)}
function handleCorrectAnswer(btn){state.locked=true;btn.classList.add('ok');state.score+=10;feedback(true);confetti(36);playSound('ok');collectLeaf(btn);updateHUD();later(nextQuestion,1800)}
function handleWrongAnswer(btn){state.lives--;btn.classList.add('bad');feedback(false);playSound('bad');
  if(state.cur.kind==='order')setTimeout(()=>btn.classList.remove('bad'),700);else btn.disabled=true;
  const h=$('#hcH');h.classList.remove('hit');void h.offsetWidth;h.classList.add('hit');updateHUD();
  if(state.lives<=0){state.locked=true;later(showGameOver,1100)}}
function collectLeaf(from){const f=document.createElement('div');f.className='fly';f.textContent='🍁';
  const r=from.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;f.style.left=cx+'px';f.style.top=cy+'px';document.body.appendChild(f);
  const t=$('#basket').getBoundingClientRect(),tx=t.left+t.width/2,ty=t.top+t.height/3;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.transform=`translate(${tx-cx}px,${ty-cy}px) rotate(540deg) scale(.7)`}));
  const g=state.gen;setTimeout(()=>{f.remove();if(g!==state.gen)return;state.leaves++;playSound('pop');
    const p=document.createElement('div');p.className='plus';p.textContent='🍁 +1';p.style.left=tx+'px';p.style.top=(t.top-10)+'px';document.body.appendChild(p);setTimeout(()=>p.remove(),1100);
    if(state.leaves%10===0){state.score+=20;setTimeout(()=>{const b=document.createElement('div');b.className='plus';b.textContent='⭐ Бонус +20';b.style.left=tx+'px';b.style.top=(t.top-60)+'px';document.body.appendChild(b);setTimeout(()=>b.remove(),1100)},300)}
    updateHUD()},880)}
function nextQuestion(){state.qi++;
  if(state.qi>=PLAN.length){showFinalScreen();return}
  if(PLAN[state.qi].lv!==PLAN[state.qi-1].lv){showLevelComplete(PLAN[state.qi-1].lv);return}
  loadQuestion()}

/* ===== Панельдер ===== */
function panel(o){$('#pTitle').innerHTML=o.title;$('#pImgs').innerHTML=o.imgs;$('#pBody').innerHTML=o.body;const b=$('#pBtn');b.innerHTML=o.btn;b.onclick=()=>{unlock();o.fn()};show('panel')}
const heroImg=()=>`<img src="${IMG[state.hero]}" alt="">`;
function saveHi(){if(state.score>hi){hi=state.score;try{localStorage.setItem('kuz_hi',hi)}catch(e){}}$('#hiS').textContent=hi}
function showLevelComplete(l){playSound('ok');confetti(50);
  panel({title:'🎉 Деңгей аяқталды!',imgs:`<img class="s" src="${IMG.star}"><img class="s" style="animation-delay:.2s" src="${IMG.star}"><img class="s" style="animation-delay:.4s" src="${IMG.star}">${heroImg()}<img src="${IMG.pile}" alt="">`,
    body:`${LV[l].i} «${LV[l].n}» өтілді!<br>🍁 Жапырақ: ${state.leaves} &nbsp; ⭐ Ұпай: ${state.score}`,btn:`▶ ${l+2}-ДЕҢГЕЙ: ${LV[l+1].n.toUpperCase()}`,fn:loadQuestion})}
function showGameOver(){state.gen++;saveHi();
  panel({title:'Ойын аяқталды',imgs:`<img src="${IMG.hedgehog}" alt=""><img src="${IMG.chestC}" alt="">`,
    body:`Қиын емес, қайта байқап көрейік! 💪<br>⭐ Ұпай: ${state.score} &nbsp; 🍁 Жапырақ: ${state.leaves}`,btn:'🔄 ҚАЙТА ОЙНАУ',fn:restartGame})}
function showFinalScreen(){state.gen++;saveHi();playSound('win');confetti(90);setTimeout(()=>confetti(60),600);
  panel({title:'🏆 ЖАРАЙСЫҢДАР!',imgs:`<img src="${IMG.boy}" alt=""><img src="${IMG.trophy}" alt=""><img src="${IMG.chestO}" alt=""><img src="${IMG.girl}" alt="">`,
    body:`🍂 Сендер барлық жапырақты жинадыңдар!<br>⭐ Ұпай: ${state.score}<br>🍁 Жапырақ: ${state.leaves}<br>🏅 Мәртебең: «Күзгі математик»`,btn:'🔄 ҚАЙТА ОЙНАУ',fn:restartGame})}

/* ===== Бастау / қайта бастау ===== */
function startGame(){unlock();Object.assign(state,{qi:0,lives:3,score:0,leaves:0,shown:0,locked:true,cur:null});state.gen++;
  $('#hero').src=IMG[state.hero];$('#hScore').textContent=0;loadQuestion()}
function restartGame(){startGame()}

/* ===== Іске қосу ===== */
document.querySelectorAll('[data-s]').forEach(e=>e.src=IMG[e.dataset.s]);
$('#bg').style.backgroundImage=`url(${IMG.bg})`;
const rs=document.documentElement.style;rs.setProperty('--ny',`url(${IMG.noteY})`);rs.setProperty('--ng',`url(${IMG.noteG})`);rs.setProperty('--np',`url(${IMG.noteP})`);rs.setProperty('--nb',`url(${IMG.noteB})`);
$('#road').style.backgroundImage=`url(${IMG.plat})`;
$('#hiS').textContent=hi;
$('#pBoy').onclick=()=>{state.hero='boy';$('#pBoy').classList.add('sel');$('#pGirl').classList.remove('sel')};
$('#pGirl').onclick=()=>{state.hero='girl';$('#pGirl').classList.add('sel');$('#pBoy').classList.remove('sel')};
$('#startBtn').onclick=startGame;
const LE=['🍁','🍂','🍃','🍁','🍂'];const lc=$('#leaves');
for(let i=0;i<14;i++){const s=document.createElement('span');s.className='fl';s.textContent=LE[i%5];s.style.left=rnd(0,95)+'vw';s.style.fontSize=rnd(20,38)+'px';s.style.animationDuration=rnd(9,16)+'s';s.style.animationDelay='-'+rnd(0,14)+'s';lc.appendChild(s)}
</script></body></html>
